[versions]
agp = "9.2.0"
compose = "2.0.21"
ktAndroid = "2.2.21"

bom = "2026.08.00"
coreKtx = "1.19.1"
startup = "1.2.0"
activityCompose = "1.13.0"
uiTooling = "1.12.1"
material3 = "1.4.0"
material = "1.14.0"
filesystem = "1.0.0"
navigation = "2.9.6"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "bom" }
startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startup" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "uiTooling" }
ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "uiTooling" }
ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "uiTooling" }
material = { module = "com.google.android.material:material", version.ref = "material" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose"}
filesystem = { module = 'io.github.sifisofakude.filesystem:filesystem-android', version.ref = "filesystem"}
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "ktAndroid" }
compose-android = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "compose" }
